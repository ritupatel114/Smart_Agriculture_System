{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="container mt-5" style="max-width:500px;">
    <div class="card shadow">
        <div class="card-header bg-success text-white text-center">
            <h3>🔐 Admin Login</h3>
        </div>
        <div class="card-body">
            <form method="POST">
                <div class="mb-3">
                    <label>Username</label>
                    <input type="text"
                           class="form-control"
                           name="username"
                           required>
                </div>
                <div class="mb-3">
                    <label>Password</label>
                    <input type="password"
                           class="form-control"
                           name="password"
                           required>
                </div>
                <button class="btn btn-success w-100">
                    Login
                </button>
            </form>
            {% if error %}
            <div class="alert alert-danger mt-3">
                {{ error }}
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
