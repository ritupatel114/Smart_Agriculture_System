{% extends "base.html" %}

{% block content %}

<div class="container mt-5">
    <div class="card shadow p-4">

        <h2 class="text-center text-success mb-4">
            🌿
            <span class="lang-en">AI Leaf Disease Detection</span>
            <span class="lang-gu">AI દ્વારા પાનના રોગની ઓળખ</span>
        </h2>

        <form action="/predict" method="POST" enctype="multipart/form-data">

            <div class="mb-3">
                <label class="form-label">
                    <span class="lang-en">Upload Leaf Image</span>
                    <span class="lang-gu">પાનની તસવીર અપલોડ કરો</span>
                </label>

                <input
                    type="file"
                    class="form-control"
                    name="leaf_image"
                    accept="image/*"
                    required
                >
            </div>

            <div class="text-center">
                <button class="btn btn-success">

                    <span class="lang-en">Detect Disease</span>
                    <span class="lang-gu">રોગની ઓળખ કરો</span>

                </button>
            </div>

        </form>

    </div>
</div>

{% endblock %}
