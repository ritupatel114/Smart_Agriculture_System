{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-success text-center mb-4">
        🌾
        <span class="lang-en">Crop Management</span>
        <span class="lang-gu">પાક વ્યવસ્થાપન</span>
    </h2>

    <div class="card shadow p-4">

        <form action="{{ url_for('add_crop') }}" method="POST">

            <div class="mb-3">
                <label>
                    <span class="lang-en">Farmer</span>
                    <span class="lang-gu">ખેડૂત</span>
                </label>

                <select name="farmer_id" class="form-control" required>
                    {% for farmer in farmers %}
                    <option value="{{ farmer.id }}">{{ farmer.name }}</option>
                    {% endfor %}
                </select>
            </div>


            <div class="mb-3">
                <label>
                    <span class="lang-en">Crop Name</span>
                    <span class="lang-gu">પાકનું નામ</span>
                </label>

                <input
                    type="text"
                    name="crop_name"
                    class="form-control"
                    required>
            </div>


            <div class="mb-3">
                <label>
                    <span class="lang-en">Season</span>
                    <span class="lang-gu">પાકની સીઝન</span>
                </label>

                <input
                    type="text"
                    name="season"
                    class="form-control"
                    required>
            </div>


            <div class="mb-3">
                <label>
                    <span class="lang-en">Area (Acres)</span>
                    <span class="lang-gu">વિસ્તાર (એકર)</span>
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="area"
                    class="form-control"
                    required>
            </div>


            <div class="mb-3">
                <label>
                    <span class="lang-en">Production (kg)</span>
                    <span class="lang-gu">ઉત્પાદન (કિલોગ્રામ)</span>
                </label>

                <input
                    type="number"
                    step="0.01"
                    name="production"
                    class="form-control"
                    required>
            </div>


            <button class="btn btn-success">
                <span class="lang-en">Save Crop</span>
                <span class="lang-gu">પાક ઉમેરો</span>
            </button>

        </form>

    </div>

</div>

{% endblock %}
