{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>Add Crop</h3>
        </div>

        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label>Select Farmer</label>

                    <select name="farmer_id" class="form-control" required>

                        <option value="">Select Farmer</option>

                        {% for farmer in farmers %}
                        <option value="{{ farmer.id }}">
                            {{ farmer.name }}
                        </option>
                        {% endfor %}

                    </select>
                </div>

                <div class="mb-3">
                    <label>Crop Name</label>

                    <input
                        type="text"
                        name="crop_name"
                        class="form-control"
                        required>
                </div>

                <div class="mb-3">
                    <label>Season</label>

                    <select
                        name="season"
                        class="form-control"
                        required>

                        <option value="">Select Season</option>
                        <option>Kharif</option>
                        <option>Rabi</option>
                        <option>Zaid</option>

                    </select>
                </div>

                <div class="mb-3">
                    <label>Area (Acres)</label>

                    <input
                        type="number"
                        step="0.01"
                        name="area"
                        class="form-control"
                        required>
                </div>

                <button class="btn btn-success">
                    Save Crop
                </button>

                <a href="{{ url_for('crops') }}" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
