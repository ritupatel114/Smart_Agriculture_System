{% extends "base.html" %}

{% block content %}

<div class="container mt-5">

    <h2 class="text-center text-success mb-4">
        🌾 Smart Crop Recommendation
    </h2>

    <div class="card shadow">
        <div class="card-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Soil Type</label>
                    <select class="form-select" name="soil" required>
                        <option value="">Select Soil Type</option>
                        <option>Loamy</option>
                        <option>Clay</option>
                        <option>Sandy</option>
                        <option>Black Soil</option>
                        <option>Red Soil</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Season</label>
                    <select class="form-select" name="season" required>
                        <option value="">Select Season</option>
                        <option>Kharif</option>
                        <option>Rabi</option>
                        <option>Zaid</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Soil pH</label>
                    <input type="number" step="0.1" name="ph" class="form-control" required>
                </div>

                <button type="submit" class="btn btn-success">
                    Recommend Crop
                </button>

            </form>

        </div>
    </div>

    {% if crop %}

    <div class="card shadow mt-4 border-success">
        <div class="card-header bg-success text-white">
            Recommendation Result
        </div>

        <div class="card-body text-center">

            <h3 class="text-success">
                Recommended Crop
            </h3>

            <h2>{{ crop }}</h2>

        </div>
    </div>

    {% endif %}

</div>

{% endblock %}
