{% extends 'base.html' %}

{% block content %}

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header bg-success text-white">
            <h3>Add Farmer</h3>
        </div>

        <div class="card-body">

            <form method="POST">

    <div class="mb-3">
        <label>Name</label>
        <input
            type="text"
            name="name"
            class="form-control"
            value="{{ farmer.name if farmer else '' }}"
            required>
    </div>

    <div class="mb-3">
        <label>Village</label>
        <input
            type="text"
            name="village"
            class="form-control"
            value="{{ farmer.village if farmer else '' }}"
            required>
    </div>

    <div class="mb-3">
        <label>Mobile</label>
        <input
            type="text"
            name="mobile"
            class="form-control"
            value="{{ farmer.mobile if farmer else '' }}"
            required>
    </div>

    <div class="mb-3">
        <label>Land (Acres)</label>
        <input
            type="number"
            step="0.01"
            name="land"
            class="form-control"
            value="{{ farmer.land if farmer else '' }}"
            required>
    </div>

    <button class="btn btn-success">
        Save Farmer
    </button>

    <a href="{{ url_for('farmers') }}" class="btn btn-secondary">
        Cancel
    </a>

</form>
                <a href="/farmers" class="btn btn-secondary">
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
